services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tarefasdb
      MYSQL_USER: ${DB_USERNAME:-tarefas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tarefas_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
