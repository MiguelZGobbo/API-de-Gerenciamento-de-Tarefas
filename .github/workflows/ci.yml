name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode test

  integration:
    name: Compose and MySQL integration
    runs-on: ubuntu-24.04
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/tarefasdb?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: tarefas
      DB_PASSWORD: tarefas_dev_password
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start MySQL with Docker Compose
        run: docker compose up --detach --wait

      - name: Run API integration test
        run: ./mvnw --batch-mode -Pintegration-tests verify

      - name: Stop MySQL
        if: always()
        run: docker compose down --volumes
